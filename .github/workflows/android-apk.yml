name: Compilar APK

on:
  push:
    paths:
      - 'video-downloader/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-downloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DescargadorDeVideos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DescargadorDeVideos
          path: video-downloader/DescargadorDeVideos.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest DescargadorDeVideos.apk \
            --target "$GITHUB_SHA" \
            --title "Descargador de Videos (última versión)" \
            --notes "APK compilado automáticamente desde la rama ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7})." \
            --prerelease
