plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ipc19.videodownloader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ipc19.videodownloader'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Clave fija incluida en el repo para que cada APK compilado se pueda
        // instalar encima del anterior sin desinstalar.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
